services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aqualens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqualens
      POSTGRES_PASSWORD: aqualens
      POSTGRES_DB: aqualens
    volumes:
      - aqualens_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqualens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqualens-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://aqualens:aqualens@db:5432/aqualens
      CORS_ALLOW_ORIGINS: http://localhost:3000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_KEY_FALLBACK: ${GOOGLE_API_KEY_FALLBACK:-}
      GEMINI_MODEL: gemini-2.0-flash
      PC_STAC_URL: https://planetarycomputer.microsoft.com/api/stac/v1
      DEFAULT_LOOKBACK_DAYS: "30"
      MAX_CLOUD_COVER: "30"
      UPLOAD_DIR: /app/data/uploads
      REPORT_DIR: /app/data/reports
      # Defaults run the real Gemini + agentic path.
      AQUALENS_FAKE_GEMINI: ${AQUALENS_FAKE_GEMINI:-0}
      AQUALENS_AGENTIC_MODE: ${AQUALENS_AGENTIC_MODE:-1}
      AQUALENS_USE_SAMPLE_PROVIDER: ${AQUALENS_USE_SAMPLE_PROVIDER:-0}
    volumes:
      - aqualens_uploads:/app/data/uploads
      - aqualens_reports:/app/data/reports
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-alpine
    container_name: aqualens-frontend
    working_dir: /app
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - aqualens_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev"

volumes:
  aqualens_pgdata:
  aqualens_uploads:
  aqualens_reports:
  aqualens_node_modules:
