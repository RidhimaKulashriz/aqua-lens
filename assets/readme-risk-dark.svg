<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AquaLens risk model</title>
  <desc id="desc">Five satellite contributors feed a weighted score, field evidence adds a bounded bonus, and the clamped result becomes low, medium, or high urgency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151525"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#e6f1ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">AquaLens / deterministic risk model</text>
  <text x="60" y="94" fill="#8ca5b9" font-family="Inter,Arial,sans-serif" font-size="16">The AI narrative explains the result. It does not move the result.</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g fill="#102a43" stroke="#60a5fa" stroke-width="2"><rect x="70" y="145" width="190" height="56" rx="13"/><rect x="70" y="223" width="190" height="56" rx="13"/><rect x="70" y="301" width="190" height="56" rx="13"/><rect x="70" y="379" width="190" height="56" rx="13"/><rect x="70" y="457" width="190" height="56" rx="13"/></g>
    <g fill="#eff6ff" font-size="16" font-weight="700"><text x="165" y="179" text-anchor="middle">NDCI · 0.40</text><text x="165" y="257" text-anchor="middle">NDTI · 0.25</text><text x="165" y="335" text-anchor="middle">NDVI · 0.10</text><text x="165" y="413" text-anchor="middle">MNDWI · 0.10</text><text x="165" y="491" text-anchor="middle">NDWI · 0.15</text></g>
    <rect x="390" y="260" width="245" height="95" rx="18" fill="#123b36" stroke="#2dd4bf" stroke-width="2"/><text x="512" y="299" text-anchor="middle" fill="#ecfeff" font-size="19" font-weight="700">Weighted base score</text><text x="512" y="326" text-anchor="middle" fill="#a7f3d0" font-size="14">normalise → combine → explain</text>
    <rect x="745" y="260" width="245" height="95" rx="18" fill="#3b2a1f" stroke="#fbbf24" stroke-width="2"/><text x="867" y="299" text-anchor="middle" fill="#fef3c7" font-size="19" font-weight="700">Field evidence</text><text x="867" y="326" text-anchor="middle" fill="#fde68a" font-size="14">bounded bonus · max 0.50</text>
    <rect x="1100" y="260" width="200" height="95" rx="18" fill="#30214d" stroke="#a78bfa" stroke-width="2"/><text x="1200" y="299" text-anchor="middle" fill="#f5f3ff" font-size="19" font-weight="700">Clamp 0 → 1</text><text x="1200" y="326" text-anchor="middle" fill="#ddd6fe" font-size="14">stable final score</text>
    <g><rect x="1360" y="145" width="170" height="72" rx="16" fill="#123b36" stroke="#34d399" stroke-width="2"/><text x="1445" y="177" text-anchor="middle" fill="#d1fae5" font-size="18" font-weight="700">LOW</text><text x="1445" y="199" text-anchor="middle" fill="#a7f3d0" font-size="13">0.00–0.32 · routine</text></g>
    <g><rect x="1360" y="260" width="170" height="72" rx="16" fill="#4a3512" stroke="#fbbf24" stroke-width="2"/><text x="1445" y="292" text-anchor="middle" fill="#fef3c7" font-size="18" font-weight="700">MEDIUM</text><text x="1445" y="314" text-anchor="middle" fill="#fde68a" font-size="13">0.33–0.65</text></g>
    <g><rect x="1360" y="375" width="170" height="72" rx="16" fill="#4c2020" stroke="#fb7185" stroke-width="2"/><text x="1445" y="407" text-anchor="middle" fill="#ffe4e6" font-size="18" font-weight="700">HIGH</text><text x="1445" y="429" text-anchor="middle" fill="#fecdd3" font-size="13">0.66–1.00</text></g>
  </g>
  <g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M260 173 C315 173 330 280 385 280"/><path d="M260 251 C315 251 330 290 385 290"/><path d="M260 329H385"/><path d="M260 407 C315 407 330 320 385 320"/><path d="M260 485 C315 485 330 330 385 330"/><path d="M635 307H740"/><path d="M990 307H1095"/><path d="M1300 280 C1330 250 1335 190 1355 190"/><path d="M1300 307H1355"/><path d="M1300 335 C1330 365 1335 410 1355 410"/></g>
  <text x="800" y="555" fill="#8ca5b9" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">Evidence examples: algae · suspicious colour or odour · dead fish · complaints · rainfall</text>
</svg>
