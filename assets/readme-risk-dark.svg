<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">AquaLens deterministic risk calculation</title>
  <desc id="desc">A table of five normalised spectral contributors and their weights, followed by a bounded latest-evidence adjustment, score clamp and risk thresholds.</desc>
  <rect width="1400" height="570" fill="#10171d"/>
  <text x="42" y="48" fill="#dfe8eb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="1.8">DETERMINISTIC RISK MODEL</text>
  <text x="1358" y="48" fill="#84969d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" letter-spacing="1.4">PURE FUNCTION · BOUNDED OUTPUT</text>
  <line x1="42" y1="72" x2="1358" y2="72" stroke="#34434b" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="111" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.4">BASE SCORE / NORMALISED SPECTRAL INPUTS</text>
    <text x="1020" y="111" fill="#84969d" font-size="11" text-anchor="end" letter-spacing="1.2">WEIGHT</text>
    <text x="1338" y="111" fill="#84969d" font-size="11" text-anchor="end" letter-spacing="1.2">NORMALISATION</text>

    <g stroke="#34434b" stroke-width="1">
      <line x1="62" y1="132" x2="1338" y2="132"/>
      <line x1="62" y1="190" x2="1338" y2="190"/>
      <line x1="62" y1="248" x2="1338" y2="248"/>
      <line x1="62" y1="306" x2="1338" y2="306"/>
      <line x1="62" y1="364" x2="1338" y2="364"/>
      <line x1="62" y1="422" x2="1338" y2="422"/>
    </g>

    <g fill="#e0e8eb" font-size="15" font-weight="600">
      <text x="62" y="168">NDCI · chlorophyll proxy</text>
      <text x="62" y="226">NDTI · turbidity proxy</text>
      <text x="62" y="284">NDVI · vegetation signal</text>
      <text x="62" y="342">MNDWI · water-signal floor</text>
      <text x="62" y="400">NDWI · water-signal floor</text>
    </g>

    <g fill="#83b8bd" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="end">
      <text x="1020" y="168">0.40</text>
      <text x="1020" y="226">0.25</text>
      <text x="1020" y="284">0.10</text>
      <text x="1020" y="342">0.10</text>
      <text x="1020" y="400">0.15</text>
    </g>

    <g fill="#95a5ab" font-size="13" text-anchor="end">
      <text x="1338" y="168">[-0.1, 0.5]</text>
      <text x="1338" y="226">[-0.2, 0.6]</text>
      <text x="1338" y="284">[0.0, 0.6]</text>
      <text x="1338" y="342">1 − norm(MNDWI, 0, 0.5)</text>
      <text x="1338" y="400">1 − norm(NDWI, 0, 0.5)</text>
    </g>

    <text x="62" y="455" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.4">LATEST FIELD-EVIDENCE ADJUSTMENT</text>
    <text x="62" y="481" fill="#95a5ab" font-size="13">Algae · suspicious colour / odour · dead fish · complaints · rainfall</text>
    <text x="1338" y="481" fill="#e0e8eb" font-size="14" font-weight="600" text-anchor="end">BONUS CAP: 0.50</text>

    <line x1="62" y1="500" x2="1338" y2="500" stroke="#34434b" stroke-width="1"/>
    <text x="62" y="533" fill="#e0e8eb" font-size="15" font-weight="600">FINAL = clamp(base score + evidence bonus, 0, 1)</text>

    <g font-size="12" font-weight="700" text-anchor="middle">
      <rect x="810" y="514" width="145" height="32" fill="#182d2c" stroke="#527d73" stroke-width="1"/>
      <text x="882" y="535" fill="#b9d8ca">LOW &lt; 0.33</text>
      <rect x="965" y="514" width="175" height="32" fill="#302d23" stroke="#8b805c" stroke-width="1"/>
      <text x="1052" y="535" fill="#dfd2a6">MEDIUM &lt; 0.66</text>
      <rect x="1150" y="514" width="188" height="32" fill="#352527" stroke="#98686a" stroke-width="1"/>
      <text x="1244" y="535" fill="#e6babb">HIGH ≥ 0.66</text>
    </g>
  </g>
</svg>