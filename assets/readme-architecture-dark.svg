<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AquaLens system architecture</title>
  <desc id="desc">A restrained engineering schematic showing the browser application, FastAPI application layer, deterministic satellite and risk pipeline, persistence, and external services.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#7d969e" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#10171d"/>
  <text x="42" y="48" fill="#dfe8eb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="1.8">AQUALENS / SYSTEM ARCHITECTURE</text>
  <text x="1358" y="48" fill="#84969d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" letter-spacing="1.4">APPLICATION · PROCESSING · DATA</text>
  <line x1="42" y1="72" x2="1358" y2="72" stroke="#34434b" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="42" y="112" width="278" height="440" fill="#131e25" stroke="#3b4c55" stroke-width="1"/>
    <rect x="360" y="112" width="250" height="440" fill="#131e25" stroke="#3b4c55" stroke-width="1"/>
    <rect x="650" y="112" width="390" height="440" fill="#131e25" stroke="#3b4c55" stroke-width="1"/>
    <rect x="1080" y="112" width="278" height="440" fill="#131e25" stroke="#3b4c55" stroke-width="1"/>

    <text x="62" y="145" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.6">01 / PRESENTATION</text>
    <text x="380" y="145" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.6">02 / APPLICATION API</text>
    <text x="670" y="145" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.6">03 / COMPUTATION</text>
    <text x="1100" y="145" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.6">04 / PERSISTENCE</text>

    <g fill="#e0e8eb" font-size="16" font-weight="600">
      <text x="62" y="190">Next.js 15 / React 19</text>
      <text x="62" y="260">Geospatial interface</text>
      <text x="62" y="330">Monitoring workspace</text>
      <text x="62" y="400">Evidence and reporting</text>
      <text x="62" y="470">Typed API client</text>

      <text x="380" y="190">FastAPI application</text>
      <text x="380" y="260">Pydantic schemas</text>
      <text x="380" y="330">SQLModel / SQLAlchemy</text>
      <text x="380" y="400">BackgroundTasks</text>
      <text x="380" y="470">Versioned REST routes</text>

      <text x="670" y="190">STAC scene discovery</text>
      <text x="670" y="243">Rasterio clipping and alignment</text>
      <text x="670" y="296">NDWI + MNDWI water mask</text>
      <text x="670" y="349">Six-index NumPy aggregation</text>
      <text x="670" y="402">Deterministic risk model</text>
      <text x="670" y="481">Optional Gemini reasoning</text>

      <text x="1100" y="190">Session and AOI records</text>
      <text x="1100" y="260">Indices, risk and evidence</text>
      <text x="1100" y="330">PostGIS geometry</text>
      <text x="1100" y="400">Agent traces and memory</text>
      <text x="1100" y="470">PDF and image files</text>
    </g>

    <g fill="#95a5ab" font-size="12">
      <text x="62" y="211">App Router · hooks · components</text>
      <text x="62" y="281">MapLibre · GeoJSON · basemaps</text>
      <text x="62" y="351">Sessions · water bodies · trends</text>
      <text x="62" y="421">Field observations · PDF views</text>
      <text x="62" y="491">TanStack Query · typed requests</text>

      <text x="380" y="211">/api/v1</text>
      <text x="380" y="281">Request and response validation</text>
      <text x="380" y="351">Database access and models</text>
      <text x="380" y="421">In-process job execution</text>
      <text x="380" y="491">Health · AOIs · sessions · evidence</text>

      <text x="670" y="211">Sentinel-2 L2A candidate selection</text>
      <text x="670" y="264">Band scaling · common array grid</text>
      <text x="670" y="317">Valid pixels and water classification</text>
      <text x="670" y="370">NDWI · MNDWI · NDTI · NDCI · NDVI · WRI</text>
      <text x="670" y="423">Normalisation · weights · evidence bonus</text>
      <text x="670" y="502">Coordinator · Scout · Historian · Analyst · Reporter</text>
    </g>

    <g stroke="#34434b" stroke-width="1">
      <line x1="62" y1="226" x2="300" y2="226"/>
      <line x1="62" y1="296" x2="300" y2="296"/>
      <line x1="62" y1="366" x2="300" y2="366"/>
      <line x1="62" y1="436" x2="300" y2="436"/>
      <line x1="380" y1="226" x2="590" y2="226"/>
      <line x1="380" y1="296" x2="590" y2="296"/>
      <line x1="380" y1="366" x2="590" y2="366"/>
      <line x1="380" y1="436" x2="590" y2="436"/>
      <line x1="670" y1="226" x2="1020" y2="226"/>
      <line x1="670" y1="279" x2="1020" y2="279"/>
      <line x1="670" y1="332" x2="1020" y2="332"/>
      <line x1="670" y1="385" x2="1020" y2="385"/>
      <line x1="670" y1="438" x2="1020" y2="438"/>
      <line x1="1100" y1="226" x2="1338" y2="226"/>
      <line x1="1100" y1="296" x2="1338" y2="296"/>
      <line x1="1100" y1="366" x2="1338" y2="366"/>
      <line x1="1100" y1="436" x2="1338" y2="436"/>
    </g>

    <g fill="none" stroke="#7d969e" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M320 330 H360"/>
      <path d="M610 330 H650"/>
      <path d="M1040 330 H1080"/>
    </g>

    <text x="845" y="456" fill="#83b8bd" font-size="10" letter-spacing="1.2">NUMERIC RESULT IS AUTHORITATIVE</text>
    <text x="1100" y="502" fill="#95a5ab" font-size="12">PostgreSQL / SQLite</text>
  </g>

  <line x1="42" y1="592" x2="1358" y2="592" stroke="#34434b" stroke-width="1"/>
  <text x="42" y="623" fill="#83b8bd" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">EXTERNAL SERVICES</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="666" fill="#e0e8eb" font-size="15" font-weight="600">Satellite data</text>
    <text x="42" y="689" fill="#95a5ab" font-size="12">AWS Earth Search / Microsoft Planetary Computer</text>

    <text x="500" y="666" fill="#e0e8eb" font-size="15" font-weight="600">Language and embeddings</text>
    <text x="500" y="689" fill="#95a5ab" font-size="12">Google Gemini · optional agentic execution</text>

    <text x="1000" y="666" fill="#e0e8eb" font-size="15" font-weight="600">Map tiles</text>
    <text x="1000" y="689" fill="#95a5ab" font-size="12">OpenFreeMap</text>
  </g>

  <text x="1358" y="733" fill="#65777f" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="end" letter-spacing="1">AQUALENS / ENGINEERING OVERVIEW</text>
</svg>