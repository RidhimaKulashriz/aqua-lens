<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">AquaLens monitoring workflow</title>
  <desc id="desc">A linear workflow from area definition through satellite scene selection, spectral calculations, deterministic risk scoring, optional interpretation, and report generation. Field evidence can trigger a rescore.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#7d969e" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="1400" height="440" fill="#10171d"/>
  <text x="42" y="48" fill="#dfe8eb" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="1.8">MONITORING WORKFLOW</text>
  <text x="1358" y="48" fill="#84969d" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" letter-spacing="1.4">ONE SESSION · TRACEABLE OUTPUT</text>
  <line x1="42" y1="72" x2="1358" y2="72" stroke="#34434b" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="105" y1="176" x2="1295" y2="176" stroke="#657b83" stroke-width="1.4" marker-end="url(#arrow)"/>

    <g fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.4">
      <text x="105" y="125" text-anchor="middle">01</text>
      <text x="343" y="125" text-anchor="middle">02</text>
      <text x="581" y="125" text-anchor="middle">03</text>
      <text x="819" y="125" text-anchor="middle">04</text>
      <text x="1057" y="125" text-anchor="middle">05</text>
      <text x="1295" y="125" text-anchor="middle">06</text>
    </g>

    <g stroke="#83b8bd" stroke-width="1.5" fill="#10171d">
      <circle cx="105" cy="176" r="5"/>
      <circle cx="343" cy="176" r="5"/>
      <circle cx="581" cy="176" r="5"/>
      <circle cx="819" cy="176" r="5"/>
      <circle cx="1057" cy="176" r="5"/>
      <circle cx="1295" cy="176" r="5"/>
    </g>

    <g fill="#e0e8eb" font-size="16" font-weight="600">
      <text x="105" y="218" text-anchor="middle">Define area</text>
      <text x="343" y="218" text-anchor="middle">Select scene</text>
      <text x="581" y="218" text-anchor="middle">Calculate indices</text>
      <text x="819" y="218" text-anchor="middle">Score risk</text>
      <text x="1057" y="218" text-anchor="middle">Interpret</text>
      <text x="1295" y="218" text-anchor="middle">Report</text>
    </g>

    <g fill="#95a5ab" font-size="12">
      <text x="105" y="244" text-anchor="middle">Polygon / point</text>
      <text x="105" y="262" text-anchor="middle">Date window</text>

      <text x="343" y="244" text-anchor="middle">STAC search</text>
      <text x="343" y="262" text-anchor="middle">Cloud constraint</text>

      <text x="581" y="244" text-anchor="middle">Water mask</text>
      <text x="581" y="262" text-anchor="middle">Six measurements</text>

      <text x="819" y="244" text-anchor="middle">Weighted model</text>
      <text x="819" y="262" text-anchor="middle">Evidence adjustment</text>

      <text x="1057" y="244" text-anchor="middle">Optional Gemini</text>
      <text x="1057" y="262" text-anchor="middle">Context and summary</text>

      <text x="1295" y="244" text-anchor="middle">Persisted session</text>
      <text x="1295" y="262" text-anchor="middle">PDF and trace</text>
    </g>

    <line x1="42" y1="305" x2="1358" y2="305" stroke="#34434b" stroke-width="1"/>
    <text x="42" y="338" fill="#83b8bd" font-size="12" font-weight="700" letter-spacing="1.4">FIELD EVIDENCE FEEDBACK</text>
    <text x="42" y="375" fill="#e0e8eb" font-size="14" font-weight="600">Observation submitted</text>
    <text x="255" y="375" fill="#95a5ab" font-size="13">→</text>
    <text x="292" y="375" fill="#e0e8eb" font-size="14" font-weight="600">Evidence persisted</text>
    <text x="490" y="375" fill="#95a5ab" font-size="13">→</text>
    <text x="527" y="375" fill="#e0e8eb" font-size="14" font-weight="600">Risk recalculated</text>
    <text x="707" y="375" fill="#95a5ab" font-size="13">→</text>
    <text x="744" y="375" fill="#e0e8eb" font-size="14" font-weight="600">Narrative and report refreshed</text>
    <text x="1358" y="414" fill="#65777f" font-size="10" text-anchor="end" letter-spacing="1">AQUALENS / SESSION LIFECYCLE</text>
  </g>
</svg>