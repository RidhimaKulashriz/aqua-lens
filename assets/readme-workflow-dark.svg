<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">AquaLens monitoring workflow</title>
  <desc id="desc">AquaLens takes a water body through satellite analysis, deterministic scoring, field evidence, agent explanation, and a PDF report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1d2e"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#123b5a"/><stop offset="1" stop-color="#0d2a42"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#123f41"/><stop offset="1" stop-color="#0e3035"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#302650"/><stop offset="1" stop-color="#241d3c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1600" height="360" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#e6f1ff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">AquaLens / monitoring loop</text>
  <text x="60" y="88" fill="#8ca5b9" font-family="Inter,Arial,sans-serif" font-size="16">From a location on the map to an evidence-backed monitoring brief.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="60" y="145" width="180" height="72" rx="16" fill="url(#blue)" stroke="#38bdf8" stroke-width="2"/><text x="150" y="176" fill="#e6f1ff" font-weight="700">Choose area</text><text x="150" y="199" fill="#9cc7e6" font-size="13">map / point / polygon</text></g>
    <g><rect x="280" y="145" width="180" height="72" rx="16" fill="url(#blue)" stroke="#38bdf8" stroke-width="2"/><text x="370" y="176" fill="#e6f1ff" font-weight="700">Select window</text><text x="370" y="199" fill="#9cc7e6" font-size="13">dates + cloud cover</text></g>
    <g><rect x="500" y="145" width="180" height="72" rx="16" fill="url(#violet)" stroke="#a78bfa" stroke-width="2"/><text x="590" y="176" fill="#f5f3ff" font-weight="700">Find scene</text><text x="590" y="199" fill="#c7bff0" font-size="13">Sentinel-2 L2A / STAC</text></g>
    <g><rect x="720" y="145" width="180" height="72" rx="16" fill="url(#teal)" stroke="#2dd4bf" stroke-width="2"/><text x="810" y="176" fill="#e6fffb" font-weight="700">Analyse signal</text><text x="810" y="199" fill="#9ce5d8" font-size="13">water mask + 6 indices</text></g>
    <g><rect x="940" y="145" width="180" height="72" rx="16" fill="url(#teal)" stroke="#2dd4bf" stroke-width="2"/><text x="1030" y="176" fill="#e6fffb" font-weight="700">Score risk</text><text x="1030" y="199" fill="#9ce5d8" font-size="13">deterministic + bounded</text></g>
    <g><rect x="1160" y="145" width="180" height="72" rx="16" fill="url(#violet)" stroke="#a78bfa" stroke-width="2"/><text x="1250" y="176" fill="#f5f3ff" font-weight="700">Explain</text><text x="1250" y="199" fill="#c7bff0" font-size="13">agents + field context</text></g>
    <g><rect x="1380" y="145" width="160" height="72" rx="16" fill="#183b36" stroke="#34d399" stroke-width="2"/><text x="1460" y="176" fill="#d1fae5" font-weight="700">Report</text><text x="1460" y="199" fill="#a7f3d0" font-size="13">traceable PDF</text></g>
  </g>
  <g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M240 181H275"/><path d="M460 181H495"/><path d="M680 181H715"/><path d="M900 181H935"/><path d="M1120 181H1155"/><path d="M1340 181H1375"/></g>
  <path d="M1030 235 C1030 300, 820 310, 680 235" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <text x="830" y="330" fill="#fcd34d" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">field evidence → background rescore</text>
</svg>
