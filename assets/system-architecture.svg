<rect x="728" y="678" width="484" height="46" fill="#f2f6f7" stroke="#35596a" stroke-width="1.4"/><text x="744" y="706" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#1e3038">Persist indices · risk · evidence · optional trace and memory</text>

