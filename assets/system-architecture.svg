<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="t d">
<title id="t">AquaLens runtime architecture</title>
<desc id="d">Container diagram of the browser, FastAPI process, in-process task runner, satellite processing pipeline, optional Gemini layer, external STAC and map services, database and file storage.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#294b5d" stroke-width="1.1"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#64767e" stroke-width="1.1"/></marker></defs>
<rect width="1600" height="950" fill="#fff"/>
<text x="48" y="52" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#192a32" letter-spacing="1">SYSTEM ARCHITECTURE</text>
<text x="48" y="78" font-family="Arial,sans-serif" font-size="13" fill="#586971">Container boundaries · processing components · data stores</text>
<line x1="48" y1="99" x2="1552" y2="99" stroke="#bdc8cc"/>

<!-- Trust / runtime boundaries -->
<rect x="48" y="130" width="270" height="620" fill="#fbfcfc" stroke="#82939a" stroke-dasharray="6 5"/>
