<rect x="387" y="225" width="246" height="30" fill="#e5edef" stroke="#35596a"/>
<g font-family="Arial,sans-serif" fill="#1e3038"><text x="402" y="245" font-size="12.5" font-weight="700">HTTP interface</text><text x="402" y="283" font-size="16" font-weight="700">FastAPI · /api/v1</text><text x="402" y="307" font-size="12">Routes and Pydantic schemas</text><text x="402" y="326" font-size="12">AOIs · sessions · evidence · reports</text></g>
