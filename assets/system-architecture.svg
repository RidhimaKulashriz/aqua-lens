<rect x="1072" y="345" width="140" height="112" fill="#fff" stroke="#667a83" stroke-width="1.2"/><rect x="1072" y="345" width="140" height="28" fill="#edf1f2" stroke="#667a83"/><g font-family="Arial,sans-serif" fill="#263840"><text x="1084" y="364" font-size="12" font-weight="700">Index engine</text><text x="1084" y="400" font-size="14" font-weight="700">NumPy</text><text x="1084" y="423" font-size="11.5">water mask</text><text x="1084" y="442" font-size="11.5">six aggregates</text></g>

<rect x="728" y="525" width="210" height="108" fill="#f2f6f7" stroke="#35596a" stroke-width="1.4"/><rect x="728" y="525" width="210" height="29" fill="#e5edef" stroke="#35596a"/><g font-family="Arial,sans-serif" fill="#1e3038"><text x="743" y="544" font-size="12.5" font-weight="700">Deterministic scoring</text><text x="743" y="582" font-size="16" font-weight="700">score_risk()</text><text x="743" y="606" font-size="12">score · level · urgency</text></g>
