<text x="68" y="162">BROWSER</text><text x="380" y="162">FASTAPI PROCESS</text><text x="720" y="162">BACKGROUND ANALYSIS</text><text x="1300" y="162">EXTERNAL SERVICES</text></g>

<!-- browser -->
<rect x="75" y="235" width="216" height="180" fill="#f2f6f7" stroke="#35596a" stroke-width="1.4"/>
<rect x="75" y="235" width="216" height="32" fill="#e5edef" stroke="#35596a"/>
<g font-family="Arial,sans-serif" fill="#1e3038"><text x="90" y="256" font-size="13" font-weight="700">Web application</text><text x="90" y="296" font-size="15" font-weight="700">Next.js 15 / React 19</text><text x="90" y="322" font-size="12">App Router · typed REST client</text><text x="90" y="346" font-size="12">MapLibre · OpenFreeMap</text><text x="90" y="370" font-size="12">TanStack Query</text><text x="90" y="394" font-size="12">AOIs · sessions · evidence · PDF</text></g>

