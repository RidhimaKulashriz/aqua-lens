<text x="565" y="213">1</text><text x="674" y="213">0..*</text>
<text x="385" y="342">1</text><text x="1168" y="505">0..*</text><text x="560" y="370">water_body_id</text>
<text x="1097" y="256">1</text><text x="1168" y="402">0..*</text><text x="1168" y="378">source_session_id</text>
<text x="906" y="672">1</text>
<text x="194" y="708">0..*</text><text x="506" y="708">0..*</text><text x="829" y="708">0..*</text><text x="1134" y="708">0..1</text><text x="1439" y="708">0..1</text>
<text x="1110" y="961">nullable FK</text>
</g>

<line x1="48" y1="985" x2="1592" y2="985" stroke="#bdc8cc"/>
<g font-family="Arial,sans-serif" font-size="11" fill="#586971"><text x="48" y="1008">PK = primary key · FK = foreign key · FK? = nullable foreign key · UNIQUE = one row per session</text><text x="48" y="1030">PostgreSQL adds PostGIS geometry support and a pgvector mirror / HNSW index for semantic memory search. SQLite is used in local and test configurations.</text></g>
</svg>